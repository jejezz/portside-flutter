name: Release

# v로 시작하는 태그를 푸시하면 (예: v0.1.0) macOS DMG(서명/공증 포함),
# Windows 인스톨러, Linux tarball을 각 잡에서 병렬로 빌드해 워크플로
# 아티팩트로 올린 뒤, 마지막 release 잡이 셋 다 성공했을 때만 한 번에
# 모아서 같은 태그의 GitHub Release를 만든다. 플랫폼 중 하나라도 실패하면
# 릴리즈 자체가 생성되지 않아 일부만 올라간 릴리즈가 남지 않는다.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable

      # flutter_libserialport가 CocoaPods로 libserialport C 라이브러리를
      # 소스 빌드하는 데 필요 (README 참고).
      - name: Install native build tools
        run: brew install autoconf automake libtool pkg-config create-dmg

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo -n "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - run: flutter pub get

      - run: flutter build macos --release

      - name: Sign app (Developer ID, hardened runtime)
        run: |
          APP_PATH="build/macos/Build/Products/Release/Portside.app"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          test -n "$IDENTITY"

          codesign --force --deep --options runtime \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$IDENTITY" "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Package DMG
        run: |
          APP_PATH="build/macos/Build/Products/Release/Portside.app"
          DMG_PATH="Portside-${{ github.ref_name }}.dmg"

          # create-dmg는 완성된 DMG를 만들고도 이런저런 경고 때문에 종종
          # 0이 아닌 종료 코드를 내는 걸로 알려져 있어서, 실패로 치지 않고
          # 실제로 파일이 생겼는지로 판단한다.
          create-dmg \
            --volname "Portside" \
            --window-size 500 300 \
            --icon-size 100 \
            --app-drop-link 380 120 \
            "$DMG_PATH" \
            "$APP_PATH" || true

          test -f "$DMG_PATH"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      # APPLE_ID_PASSWORD는 계정 비밀번호가 아니라 appleid.apple.com에서
      # 발급하는 앱 암호(app-specific password)여야 한다.
      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$DMG_PATH"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: ${{ env.DMG_PATH }}
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable

      - run: flutter pub get

      - name: Build Windows release
        run: .\scripts\build-app-windows.ps1

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Package installer
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$version" `
            installer\windows\portside.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/PortsideSetup-*.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable

      # Flutter Linux desktop 빌드에 필요한 표준 도구 체인(flutter doctor
      # 권장 목록). flutter_libserialport는 CMake로 libserialport를 소스
      # 빌드하므로 추가 시스템 패키지는 필요 없다.
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - run: flutter pub get

      - run: flutter build linux --release

      - name: Package tarball
        run: |
          STAGE_DIR="portside"
          rm -rf "$STAGE_DIR"
          cp -r build/linux/x64/release/bundle "$STAGE_DIR"

          tar czf "Portside-${{ github.ref_name }}-linux-x64.tar.gz" "$STAGE_DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: Portside-*-linux-x64.tar.gz
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "Portside ${{ github.ref_name }}" \
            --generate-notes
