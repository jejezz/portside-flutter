name: portside
description: "Portside — 시리얼(USB-to-COM) 터미널"
publish_to: 'none'
version: 0.1.8+18

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_libserialport: ^0.6.0
  provider: ^6.1.5+1
  xterm2: ^5.2.0
  shared_preferences: ^2.5.5
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true

flutter:
  uses-material-design: true

  fonts:
    - family: SeoulNamsan
      fonts:
        - asset: assets/fonts/seoul_namsan_light.ttf
          weight: 300
        - asset: assets/fonts/seoul_namsan_regular.ttf
          weight: 400
        - asset: assets/fonts/seoul_namsan_bold.ttf
          weight: 700
        - asset: assets/fonts/seoul_namsan_extra_bold.ttf
          weight: 800
